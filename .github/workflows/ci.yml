name: CI

on:
  push:
  pull_request:
  schedule:
  - cron: "0 0 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    container: continuumio/miniconda3:latest

    steps:
    - uses: actions/checkout@v5
    - name: Build
      run: |
        python -m pip install --upgrade pip
        pip install .
    - name: Lint
      run: |
        pip install black
        black --check --diff --color --line-length 127 pycce
    - name: Test
      run: |
        pip install pytest
        pytest
